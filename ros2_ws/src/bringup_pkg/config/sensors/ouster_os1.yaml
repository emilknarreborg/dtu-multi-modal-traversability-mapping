lidar_cost_node:
  ros__parameters:
    lidar_input_topic: /os1_cloud_node/points
    # Transform cloud from ouster1/os1_lidar into base_link via URDF TF chain.
    # The URDF includes a pitch=π flip (os1_to_imu joint) that accounts for the
    # Ouster being mounted upside-down, so slope/roughness are computed in the
    # gravity-aligned frame without needing the IMU AHRS path.
    lidar_tf_frame: ouster1/os1_lidar
    # Ouster OS1 produces ~131k points per scan. Downsample to ~0.2 m voxels
    # before KDTree neighbor search to keep processing time manageable.
    voxel_size: 0.5
